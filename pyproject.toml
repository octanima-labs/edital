[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edital"
version = "0.1.0"
description = "Transactional and state-full terminal text editor"
readme = "README.md"
license = "MIT"
authors = [
  { name = "octanima-labs", email = "34071457+octanima-labs@users.noreply.github.com" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "textual>=8.0,<9",
  "platformdirs>=4,<5",
  "PyYAML>=6,<7",
]

[project.scripts]
edital = "edital.cli:main"

[project.urls]
Repository = "https://github.com/octanima-labs/edital"
Documentation = "https://octanima-labs.github.io/edital"
Issues = "https://github.com/octanima-labs/confease/issues"

[dependency-groups]
dev = [
  "build",
  "mypy",
  "pytest",
  "ruff",
]
docs = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"

[tool.hatch.envs.default]
dependencies = [
  "types-PyYAML",
  "build",
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.envs.docs]
dependencies = [
  "myst-parser",
  "pydata-sphinx-theme",
  "sphinx",
  "sphinx-autodoc-typehints",
]

[tool.hatch.envs.docs.scripts]
build = "sphinx-build -W -b html docs docs/_build/html"

[tool.hatch.build.targets.wheel]
packages = ["src/edital"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
